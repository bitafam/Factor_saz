name: Android Kotlin Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # ۱. تولید خودکار گریدل در صورتی که در پروژه وجود نداشته باشد
    - name: Generate Gradle Wrapper if Missing
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Gradlew missing. Generating a new gradle wrapper..."
          gradle wrapper --gradle-version 8.2
          echo "FOUND_DIR=." >> $GITHUB_ENV
        else
          chmod +x "$GRADLEW_PATH"
          echo "FOUND_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV
        fi

    # ۲. تزریق کلید به فایل تنظیمات
    - name: Inject GEMINI_API_KEY
      run: |
        cd "$FOUND_DIR"
        touch local.properties
        echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> local.properties
        echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties

    # ۳. کامپایل و ساخت فایل نصب اندروید
    - name: Build APK with Gradle
      run: |
        cd "$FOUND_DIR"
        ./gradlew assembleDebug --stacktrace

    # ۴. آپلود فایل APK ساخته شده
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: GeminiKotlinApp
        path: "**/build/outputs/apk/debug/*.apk"
        
