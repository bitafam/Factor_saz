name: Android Build

on:
  workflow_dispatch: # این خط به شما دکمه اجرای دستی (Run workflow) را می‌دهد

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Inject API Key
      run: echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> local.properties

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: MyAndroidApp
        path: app/build/outputs/apk/debug/app-debug.apk
