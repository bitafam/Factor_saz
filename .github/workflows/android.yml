name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # این بخش مطمئن می‌شود که فایل local.properties وجود دارد و کلید را درون آن می‌گذارد
    - name: Inject API Key
      run: |
        touch local.properties
        echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> local.properties
        echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    # اجرای گریدل با قابلیت عیب‌یابی دقیق‌تر
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    # پیدا کردن خودکار فایل APK در هر پوشه‌ای که ساخته شده باشد
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: MyAndroidApp
        path: "**/build/outputs/apk/debug/*.apk"
        
