name: Android Kotlin Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # پیدا کردن پوشه کاتلین و تزریق کلید به local.properties
    - name: Inject GEMINI_API_KEY
      run: |
        find . -name "local.properties" -exec sh -c 'echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> "{}"' \;
        find . -name "local.properties" -exec sh -c 'echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> "{}"' \;
        echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> local.properties

    # پیدا کردن فایل اجرایی گریدل در پوشه‌های فرعی کاتلین
    - name: Find and Make Gradlew Executable
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found anywhere in the repository!"
          exit 1
        else
          chmod +x "$GRADLEW_PATH"
          echo "FOUND_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV
        fi

    # ورود به پوشه پروژه کاتلین و ساخت فایل APK
    - name: Build APK with Gradle
      run: |
        cd "$FOUND_DIR"
        ./gradlew assembleDebug --stacktrace

    # آپلود فایل نهایی نصب اندروید
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: GeminiKotlinApp
        path: "**/build/outputs/apk/debug/*.apk"
        
