name: Android CI/CD Workflow

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Ensure Valid Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

      - name: Create .env File
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "GEMINI_API_KEY=placeholder_for_ci_build" > .env
          fi

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "No debug.keystore.base64 found! Generating a new debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Code Compilation & Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Setup Release Keystore (Optional)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "HAS_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "No release keystore secret provided. Skipping release signing."
            echo "HAS_RELEASE_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: my-upload-key.jks
        run: ./gradlew assembleRelease

      - name: Build Signed Release Bundle (AAB)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: my-upload-key.jks
        run: ./gradlew bundleRelease

      - name: Prepare Release Artifacts
        id: prepare_files
        run: |
          mkdir -p release_outputs
          cp app/build/outputs/apk/debug/*.apk release_outputs/QuartzInvoice-v2.0.${{ github.run_number }}-debug.apk || true
          if [ "${{ env.HAS_RELEASE_KEYSTORE }}" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk release_outputs/QuartzInvoice-v2.0.${{ github.run_number }}-release.apk || true
            cp app/build/outputs/bundle/release/*.aab release_outputs/QuartzInvoice-v2.0.${{ github.run_number }}-release.aab || true
          fi
          echo "Output files prepared in release_outputs:"
          ls -la release_outputs

      - name: Upload to GitHub Releases
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('Quartz Invoice v2.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          files: release_outputs/*
          body: |
            ### 📱 فاکتور ساز سنگ کوارتز - نسخه ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
            
            فایل‌های نصبی برنامه به صورت خودکار بیلد و در بخش Releases منتشر شدند:
            
            - **فایل نصبی اصلی (APK):** `QuartzInvoice-v2.0.${{ github.run_number }}-debug.apk`
            - **وضعیت تست‌ها:** ✅ پاس شده و آماده نصب روی گوشی
            - **شماره بیلد:** ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
